<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 32" width="200" height="32" role="img" aria-labelledby="title">
  <title id="title">Showtrace</title>
  <!-- Direction A of the brand guide (brand.md, section 6.4): one hand-drawn stroke that ends in a filled dot.
       Stroke 2.75, round caps and joins, a loose open curve. Teal on light, chalk on dark.
       A session's drawing: it still needs a designer's pass and the 16 px tests. -->
  <style>
    .mark { color: #0E8192; }
    @media (prefers-color-scheme: dark) { .mark { color: #EEEEEE; } }
    .word { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 600; font-size: 24px; letter-spacing: -0.01em; }
  </style>
  <g class="mark" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 26 C5 15, 13 4, 21 4.5 C29 5, 32 15, 25 18.5 C18 22, 13 14, 19.5 11.5 C26 9, 34 17, 40 29"/>
    <circle cx="40" cy="29.2" r="2.8" fill="currentColor" stroke="none"/>
  </g>
  <text class="mark word" x="52" y="29" fill="currentColor">Showtrace</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="t d">
  <title id="t">Screenshot to come</title>
  <desc id="d">A labelled placeholder. A screenshot of real Showtrace marks on a real screen replaces it. It is not a mock.</desc>
  <!-- Labelled placeholder, not a mock: brand.md, section 8, allows real screenshots only. -->
  <style>
    .bg { fill: #F7F8F9; }
    .frame { stroke: #586069; }
    .text { fill: #586069; font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #2A2B2E; }
      .frame { stroke: #AAAAAA; }
      .text { fill: #AAAAAA; }
    }
  </style>
  <rect class="bg" width="1200" height="675"/>
  <rect class="frame" x="24" y="24" width="1152" height="627" rx="18" fill="none" stroke-width="3" stroke-dasharray="14 12"/>
  <text class="text" x="600" y="318" text-anchor="middle" font-size="48" font-weight="600">Screenshot to come</text>
  <text class="text" x="600" y="376" text-anchor="middle" font-size="30">Real Showtrace marks on a real screen, taken by an owner.</text>
  <text class="text" x="600" y="424" text-anchor="middle" font-size="30">Not a mock.</text>
</svg>
